authentik:
  postgresql:
    host: pg-cluster-rw.postgres.svc.cluster.local
    user: file:///postgres-creds/username
    password: file:///postgres-creds/password
    name: authentik
    port: 5432
  existingSecret:
    secretName: authentik-secret
    secretKey: AUTHENTIK_SECRET_KEY

global:
  env:
    # 10.42.0.184 = lb ip
    - name: AUTHENTIK_LISTEN__TRUSTED_PROXY_CIDRS
      value: 10.42.0.184/32
    - name: AUTHENTIK_POSTGRESQL__HOST
      value: "pg-cluster-rw.postgres.svc.cluster.local"
    - name: AUTHENTIK_POSTGRESQL__PORT
      value: "5432"
    - name: AUTHENTIK_POSTGRESQL__NAME
      value: "authentik"
    - name: AUTHENTIK_POSTGRESQL__USER
      valueFrom:
        secretKeyRef:
          name: authentik-pg
          key: username
    - name: AUTHENTIK_POSTGRESQL__PASSWORD
      valueFrom:
        secretKeyRef:
          name: authentik-pg
          key: password
    - name: POSTGRES_PASSWORD
      valueFrom:
        secretKeyRef:
          name: authentik-pg
          key: password
    - name: POSTGRES_USER
      valueFrom:
        secretKeyRef:
          name: authentik-pg
          key: username
    # TLS for the PostgreSQL connection.
    #
    # `AUTHENTIK_POSTGRESQL__SSLMODE` maps to authentik's
    # `postgresql.sslmode` setting, which it puts in the Django database
    # OPTIONS dict; psycopg (libpq) then reads it from there.
    #
    # `verify-full` is the important part: it encrypts the connection AND
    # verifies that the server certificate was signed by the CA in
    # SSLROOTCERT and that its SANs cover the host that was dialled. The
    # default `prefer` would encrypt opportunistically but not authenticate
    # the server at all, and `require` would encrypt without verifying
    # anything.
    #
    # The default in authentik's own default.yml is `disable`, so this has
    # to be set explicitly.
    - name: AUTHENTIK_POSTGRESQL__SSLMODE
      value: "verify-full"
    # A PATH to the CA bundle, mounted from the `internal-ca` Secret
    # (apps/authentik/certificate-internal-ca.yaml). libpq reads the file
    # from disk; this is not the PEM content.
    - name: AUTHENTIK_POSTGRESQL__SSLROOTCERT
      value: "/etc/authentik/ca/ca.crt"

postgresql:
  enabled: false

redis:
  enabled: true

server:
  volumes:
    - name: postgres-creds
      secret:
        secretName: authentik-pg
    # The trust anchor for the PostgreSQL server certificate. Only the
    # `ca.crt` key is mounted; the Secret also holds a throwaway
    # tls.crt/tls.key pair that carries nothing useful.
    - name: postgres-ca
      secret:
        secretName: internal-ca
        items:
          - key: ca.crt
            path: ca.crt
  volumeMounts:
    - name: postgres-creds
      mountPath: /postgres-creds
      readOnly: true
    - name: postgres-ca
      mountPath: /etc/authentik/ca
      readOnly: true

worker:
  volumes:
    - name: postgres-creds
      secret:
        secretName: authentik-pg
    # The worker connects to PostgreSQL as well, so it needs the same
    # trust anchor as the server.
    - name: postgres-ca
      secret:
        secretName: internal-ca
        items:
          - key: ca.crt
            path: ca.crt
  volumeMounts:
    - name: postgres-creds
      mountPath: /postgres-creds
      readOnly: true
    - name: postgres-ca
      mountPath: /etc/authentik/ca
      readOnly: true
