apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: draw-route
spec:
  entryPoints:
    - websecure
  tls:
    secretName: draw-tls
  routes:
    - match: Host(`draw.matiix310.dev`)
      kind: Rule
      middlewares:
        - name: cloudflare-only
          namespace: kube-system
      services:
        - name: excalidraw
          port: 80
