apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: wg-easy-credentials
spec:
  # Path in Vault: secret/kvv2/wg-easy/data
  # Must contain a single key: "password"
  # Generated with a strong random value, e.g.:
  #   vault kv put secret/kvv2/wg-easy/data password=$(openssl rand -base64 32)
  path: kvv2/wg-easy/data
  type: Opaque
