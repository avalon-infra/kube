apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: wireguard-ui-credentials
spec:
  # Path in Vault: secret/kvv2/wireguard-ui/data
  # Must contain a single key: "password"
  # Generated with a strong random value, e.g.:
  #   vault kv put secret/kvv2/wireguard-ui/data password=$(openssl rand -base64 32)
  # The operator will create a Secret named "wireguard-ui-credentials"
  # containing the same key.
  path: kvv2/wireguard-ui/data
  type: Opaque
