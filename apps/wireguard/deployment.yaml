apiVersion: apps/v1
kind: Deployment
metadata:
  name: wireguard-ui
  labels:
    app: wireguard-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wireguard-ui
  template:
    metadata:
      labels:
        app: wireguard-ui
    spec:
      containers:
        - name: wireguard-ui
          # Pin a specific version. Check https://github.com/ngoduykhanh/wireguard-ui/releases
          image: ghcr.io/ngoduykhanh/wireguard-ui:v0.6.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: ui
          env:
            - name: WGUI_USERNAME
              value: admin
            - name: WGUI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wireguard-ui-credentials
                  key: password
            # The host runs wg-quick@wg0; the UI must NOT also try to manage
            # the interface, otherwise the wgui-reload.path unit on the host
            # will fight with the UI's own start/stop calls.
            - name: WGUI_MANAGE_START_WG
              value: "false"
            - name: WGUI_CONFIG_FILE_PATH
              value: /etc/wireguard/wg0.conf
          volumeMounts:
            - name: wg-config
              mountPath: /etc/wireguard
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
      volumes:
        - name: wg-config
          # Single source of truth for the WireGuard config: the host's
          # /etc/wireguard. The host's wg-quick@wg0 reads from here and the
          # wgui-reload.path unit reapplies changes on save.
          hostPath:
            path: /etc/wireguard
            type: DirectoryOrCreate
