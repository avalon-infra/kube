apiVersion: apps/v1
kind: Deployment
metadata:
  name: wg-easy
  labels:
    app: wg-easy
spec:
  replicas: 1
  # Recreate so we never have two pods both trying to manage wg0
  # at the same time during a rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wg-easy
  template:
    metadata:
      labels:
        app: wg-easy
    spec:
      # wg-easy creates and manages the wg0 interface directly on the
      # host's network namespace, so it owns the WireGuard server.
      hostNetwork: true
      containers:
        - name: wg-easy
          # Pin a version: see https://github.com/wg-easy/wg-easy/releases
          image: ghcr.io/wg-easy/wg-easy:15
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 51820
              protocol: UDP
              name: wireguard
            - containerPort: 51821
              protocol: TCP
              name: ui
          env:
            # --- Runtime env vars (read on every start) ---
            - name: PORT
              value: "51821"
            - name: LANG
              value: en_US.UTF-8
            # Don't phone home to check for new versions.
            - name: DISABLE_VERSION_CHECK
              value: "true"
            # Don't try to set up IPv6 firewall rules — we don't need
            # IPv6 in the tunnel for a personal phone+laptop VPN, and
            # some cloud-provider kernels ship without ip6_tables.
            - name: DISABLE_IPV6
              value: "true"

            # --- First-start setup (read ONCE, only on a fresh database) ---
            # The INIT_* family drives the setup wizard. After the first
            # start, the values are written to the wg-easy SQLite db
            # under /etc/wireguard and the env vars are ignored. To
            # change them later, do it in the UI (or wipe the db and let
            # the wizard run again).
            - name: INIT_ENABLED
              value: "true"
            - name: INIT_USERNAME
              value: admin
            - name: INIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wg-easy-credentials
                  key: password
            # Public hostname clients use to reach the WireGuard server
            # (must resolve to the VPS public IP via DNS).
            - name: INIT_HOST
              value: wg.matiix310.dev
            # Public UDP port the WireGuard server listens on.
            - name: INIT_PORT
              value: "51820"
            # Server gets 10.8.0.1, clients get 10.8.0.2, .3, ...
            - name: INIT_IPV4_CIDR
              value: 10.8.0.0/24
            # Split tunnel: clients route the tunnel subnet AND the k3s
            # pod/service networks through the VPN. Everything else
            # (internet, the host itself) stays on the client's own route.
            #
            #   10.8.0.0/24  = the tunnel itself (peer-to-peer)
            #   10.42.0.0/16  = k3s pod network (flannel)
            #   10.43.0.0/16  = k3s service network (ClusterIPs, e.g. Vault)
            #
            # The host itself is NOT in this list, so peers cannot reach the
            # VPS public IP, 10.8.0.1, or the k3s API server by IP.
            #
            # Server-side enforcement is done by wg-easy's OWN per-client
            # firewall (enable it in the UI: "Enable Per-Client Firewall"),
            # which manages its own iptables chain and is the authoritative
            # policy. This env var is only the client-side half.
            #
            # NOTE: INIT_ALLOWED_IPS is read ONLY on the first start (fresh
            # SQLite db). For an existing deployment, change the global
            # AllowedIPs in the wg-easy UI, or set a per-client AllowedIPs
            # for your own device. See the README section "Opening the
            # tunnel to the cluster".
            - name: INIT_ALLOWED_IPS
              value: 10.8.0.0/24, 10.42.0.0/16, 10.43.0.0/16
            # Leave DNS empty — split tunnel, peers use their own DNS.
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                # Needed for `modprobe` to load kernel modules
                # (e.g. ip6_tables if you ever re-enable IPv6).
                - SYS_MODULE
          volumeMounts:
            # wg-easy persists its SQLite db and wg0.conf here. The
            # host's /etc/wireguard is the only place on the host that
            # knows about WireGuard now.
            - name: config
              mountPath: /etc/wireguard
            # Bind-mount the host's kernel modules so `modprobe` inside
            # the container can find them. Matches the official
            # docker-compose.yml.
            - name: lib-modules
              mountPath: /lib/modules
              readOnly: true
          livenessProbe:
            httpGet:
              path: /
              port: 51821
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 51821
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
      volumes:
        - name: config
          hostPath:
            path: /etc/wireguard
            type: DirectoryOrCreate
        - name: lib-modules
          hostPath:
            path: /lib/modules
            type: Directory
