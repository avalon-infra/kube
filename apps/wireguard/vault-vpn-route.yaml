# VPN-only access to Vault.
#
# ---------------------------------------------------------------------------
# DESIGN NOTE - why this works the way it does
# ---------------------------------------------------------------------------
# The obvious approach is a Traefik IPAllowList restricted to the WireGuard
# subnet (10.8.0.0/24). That does NOT work, and it is worth understanding
# why, because it explains the whole design of this file.
#
# When a VPN peer (10.8.0.x) connects to Vault's ClusterIP 10.43.9.131,
# kube-proxy DNATs the connection to the pod IP. The rule that does this is:
#
#   chain KUBE-SVC-UEJ6RQQLJG4VJPPB {
#       ip saddr != 10.42.0.0/16 ip daddr 10.43.9.131 ... jump KUBE-MARK-MASQ
#       ...
#   }
#
# Note `ip saddr != 10.42.0.0/16`: a peer at 10.8.0.x is NOT in the pod
# CIDR, so the traffic is MASQUERADED to the node IP (51.68.191.40)
# before it reaches the pod.
#
# Consequence: by the time Traefik sees the connection, the source IP is
# the NODE IP, not 10.8.0.x. An IPAllowList on 10.8.0.0/24 would reject
# every legitimate VPN request, and the only ranges that would work
# (10.42.0.0/16, 10.43.0.0/16) are so wide that any pod in the cluster
# could also reach the route. That is not a security control.
#
# Traefik has no `forwardedHeaders` and no `proxyProtocol` configured
# (verified: `kubectl -n kube-system get deploy traefik`), so it has no
# other way to recover the real client IP.
#
# Therefore: this route does NOT rely on identifying the peer by IP.
# Instead it relies on the fact that the route itself is only reachable
# from inside the tunnel.
#
# Two things make that true:
#
#  1. The hostname `vault.vpn.matiix310.dev` resolves (via peer-local
#     DNS) to the Vault ClusterIP 10.43.9.131 - NOT to the public IP.
#     The peer must be told this explicitly; see the README.
#
#  2. The public route `vault.matiix310.dev` is REMOVED, so there is no
#     longer any public path to Vault. The only way in is the tunnel.
#
# Because the public route is gone, no allowlist is needed at all: there
# is no other way to reach Vault. The control is "the route does not
# exist publicly", which is far stronger than "the route exists but
# rejects some IPs".
#
# If a public route must be kept for some reason, then the peer identity
# problem returns and the correct fix is to give Traefik a trustworthy
# client IP - e.g. `proxyProtocol` on the entrypoint with
# `trustedIPs` restricted to the node, or `forwardedHeaders` with a
# strict `ipStrategy.depth`. Neither is configured today.
# ---------------------------------------------------------------------------

apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: traefik-vault-vpn-transport
spec:
  # Vault's pod serves a certificate for vault.matiix310.dev. The VPN
  # hostname is only a Traefik routing label - the TLS handshake still
  # happens against the Vault pod - so we pin serverName instead of
  # disabling verification.
  serverName: vault.matiix310.dev
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: vault-vpn-route
spec:
  entryPoints:
    - websecure
  tls:
    secretName: vault-vpn-tls
  routes:
    - match: Host(`vault.vpn.matiix310.dev`)
      kind: Rule
      services:
        - name: vault
          port: 8200
          scheme: https
          serversTransport: traefik-vault-vpn-transport
