apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd
resources:
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.4.2/manifests/install.yaml
  - certificate.yaml
  - ingress.yaml
  - secret.yaml
patches:
  # Enable the GitHub webhook so a push syncs immediately rather than on
  # the next poll. See patch-webhook.yaml for the details.
  - path: patch-webhook.yaml
