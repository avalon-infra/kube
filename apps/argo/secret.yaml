apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: argocd-secret
  namespace: argocd
spec:
  # Setup (one-time):
  #   PASS=$(htpasswd -bnBC 10 "" 'yourpassword' | tr -d ':\n')
  #   SECRETKEY=$(kubectl get secret argocd-secret -n argocd -o jsonpath='{.data.server\.secretkey}' | base64 -d)
  #   vault kv put kvv2/argocd \
  #     password="$PASS" \
  #     passwordMtime="$(date +%FT%T%Z)" \
  #     serverSecretKey="$SECRETKEY"
  #
  # NOTE on the Vault path: the mount is `kvv2/` and the CLI path is
  # `kvv2/argocd`. The `secret/kvv2/<app>` form used elsewhere in this
  # repo is the *vault-secrets-operator's* path convention, not the Vault
  # CLI path - `vault kv get secret/kvv2/argocd` fails with a 403.
  path: kvv2/argocd
  type: Opaque
  templates:
    admin.password: "{% .Secrets.password %}"
    admin.passwordMtime: "{% .Secrets.passwordMtime %}"
    # The shared secret ArgoCD and the GitHub webhook use to
    # authenticate each other. Without it, GitHub cannot deliver the
    # push notification and ArgoCD falls back to polling.
    #
    # The value lives in Vault (`vault kv put kvv2/argocd
    # githubSecret=$(openssl rand -hex 24)`) and is NEVER in git. It must
    # be the same value that is configured as the webhook's "Secret" in
    # the GitHub repository settings.
    webhook.github.secret: "{% .Secrets.githubSecret %}"
