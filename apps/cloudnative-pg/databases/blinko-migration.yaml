apiVersion: batch/v1
kind: Job
metadata:
  name: blinko-db-migration
spec:
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: postgres:18
          env:
            - name: OLD_PGHOST
              value: postgres.blinko.svc.cluster.local
            - name: NEW_PGHOST
              value: pg-cluster-rw.postgres.svc.cluster.local
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: blinko-pg
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: blinko-pg
                  key: password
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              echo "Waiting for CNPG cluster..."
              until pg_isready -h "$NEW_PGHOST" -U "$PGUSER"; do sleep 2; done

              echo "Dumping from old postgres..."
              pg_dump -h "$OLD_PGHOST" -U "$PGUSER" -d blinko \
                --no-owner --no-privileges --clean --if-exists \
                > /tmp/blinko.sql

              echo "Restoring to CNPG cluster..."
              psql -h "$NEW_PGHOST" -U "$PGUSER" -d blinko \
                -v ON_ERROR_STOP=1 < /tmp/blinko.sql

              echo "Done."
