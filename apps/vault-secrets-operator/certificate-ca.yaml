# The internal CA bundle for the vault-secrets-operator.
#
# ---------------------------------------------------------------------------
# WHY THIS FILE EXISTS
# ---------------------------------------------------------------------------
# `vault-secrets-operator` runs in the `vault-secrets-operator-system`
# namespace and has to verify Vault's serving certificate against the
# private CA (apps/cert-manager/internal-ca.yaml). It does that with the
# `VAULT_CACERT` environment variable, which points at a FILE inside the
# pod.
#
# A pod can only mount Secrets from its OWN namespace, and the CA's Secret
# lives in `cert-manager` (the cluster resource namespace, which is where
# the `ca` ClusterIssuer reads it from). So the CA certificate has to
# exist in `vault-secrets-operator-system` too.
#
# ---------------------------------------------------------------------------
# HOW THIS IS DONE WITHOUT cert-manager-trust-manager
# ---------------------------------------------------------------------------
# trust-manager is the canonical way to distribute a CA into other
# namespaces, but it is a whole extra cluster-wide operator and a whole
# extra CRD, and this cluster has exactly one consumer of the internal CA
# so far. Adding it for one file would be a lot of machinery.
#
# Instead, this Certificate does the job with cert-manager alone:
#
#   - It is issued by the `internal-cluster-issuer` ClusterIssuer, i.e.
#     by the same private CA that signs Vault's serving certificate.
#   - cert-manager writes the CA's own certificate into the `ca.crt` key
#     of every Secret it issues from a `ca` issuer. That `ca.crt` IS the
#     trust anchor we need - the operator mounts that key and nothing
#     else.
#   - The `tls.crt` / `tls.key` keys of the same Secret are unused here.
#     They exist only because cert-manager always writes a full key pair.
#     This Secret is a carrier for one file, nothing more.
#
# So the chain the operator ends up trusting is exactly the chain that
# signed Vault's certificate - there is no second, hand-copied CA
# bundle that could drift out of sync.
#
# ---------------------------------------------------------------------------
# WHY THE CERTIFICATE ITSELF IS THROWAWAY
# ---------------------------------------------------------------------------
# The `commonName` / `dnsNames` below are never used for verification -
# the operator only reads `ca.crt`. They exist because cert-manager
# requires a Certificate to have a subject and a SAN. They are set to the
# name the operator actually dials, so that if this Secret were ever
# misused as a server certificate it would at least be the right name.
#
# The private key generated for it is throwaway too. It is never used to
# serve anything, it is never mounted anywhere, and it never leaves the
# Secret that cert-manager manages in this namespace.
# ---------------------------------------------------------------------------

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-internal-ca
  namespace: vault-secrets-operator-system
spec:
  secretName: vault-internal-ca
  issuerRef:
    name: internal-cluster-issuer
    kind: ClusterIssuer
  commonName: vault.vault.svc.cluster.local
  dnsNames:
    - "vault.vault.svc.cluster.local"
  privateKey:
    algorithm: ECDSA
    size: 256
  # Renewed like the leaf certificate. cert-manager rewrites the Secret
  # with a fresh `ca.crt` on renewal (the CA's own certificate is
  # unchanged, so the trust anchor stays the same).
  duration: 2160h    # 90 days
  renewBefore: 720h   # 30 days
