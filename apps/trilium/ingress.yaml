apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: wiki-route
spec:
  entryPoints:
    - websecure
  tls:
    secretName: wiki-tls
  routes:
    - match: Host(`wiki.matiix310.dev`)
      kind: Rule
      middlewares:
        - name: cloudflare-only
          namespace: kube-system
      services:
        - name: trilium
          port: 8080
