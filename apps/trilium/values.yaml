controllers:
  main:
    containers:
      trilium:
        env:
          TRILIUM_MULTIFACTORAUTHENTICATION_OAUTHBASEURL: "https://wiki.matiix310.dev"
          TRILIUM_MULTIFACTORAUTHENTICATION_OAUTHISSUERBASEURL:
            valueFrom:
              secretKeyRef:
                name: trilium-oidc-credentials
                key: issuer_url
          TRILIUM_MULTIFACTORAUTHENTICATION_OAUTHISSUERNAME: "Avalon SSO"
          TRILIUM_MULTIFACTORAUTHENTICATION_OAUTHCLIENTID:
            valueFrom:
              secretKeyRef:
                name: trilium-oidc-credentials
                key: client_id
          TRILIUM_MULTIFACTORAUTHENTICATION_OAUTHCLIENTSECRET:
            valueFrom:
              secretKeyRef:
                name: trilium-oidc-credentials
                key: client_secret

configini:
  network:
    trustedReverseProxy: true
