nameOverride: ""
fullnameOverride: ""

image:
  tag: 0.18.18
  pullPolicy: IfNotPresent

imagePullSecrets: []

config:
  tenancy:
    mode: single_org
    singleOrgName: OpenWork
    singleOrgSlug: default
    ownerEmails: "lucas.stephan.12@outlook.fr"
    allowPublicSignup: "false"
    requireEmailVerification: "false"
  auth:
    passwordBreachScreeningEnabled: "false"
  githubConnector:
    appId: ""
    clientId: ""
  public:
    webOrigin: https://openwork.matiix310.dev
    apiOrigin: https://openwork.matiix310.dev/api/den
    mcpResourceUrl: https://openwork.matiix310.dev/api/den/mcp
    mcpAdditionalResources: ""
    # Leave blank to keep External MCP URL SSRF protection enabled.
    # Set "1" only for trusted private-network MCP servers.
    allowPrivateMcpUrls: ""
    mcpClaimNamespace: ""
    desktopDenBaseUrl: https://openwork.matiix310.dev
    corsOrigins: https://openwork.matiix310.dev
    betterAuthTrustedOrigins: https://openwork.matiix310.dev
    webAppHosts: openwork.matiix310.dev
    bootstrapAdminEmails: "lucas.stephan.12@outlook.fr"
    installLinksGatingEnabled: "false"
    connectLinkMode: exchange
    connectLinkKeyId: ""
    openworkAppConnectUrl: ""
    openworkWebUrl: ""
    installerReleaseTag: ""
    installerReleaseRepo: ""
    authCallbackUrl: https://openwork.matiix310.dev
  internal:
    apiBaseUrl: "http://openwork-openwork-ee-den-api:8788"
    authFallbackBaseUrl: "http://openwork-openwork-ee-den-api:8788"
    inferenceProxyBaseUrl: ""
  provisioner:
    mode: stub
    reconcileIntervalMs: "60000"
    reconcileStaleMs: "1200000"
    reconcileBatchSize: "10"
    workerUrlTemplate: ""
  daytona:
    apiUrl: ""
    target: ""
    snapshot: ""
    sandboxImage: ""
    sandboxCpu: ""
    sandboxMemory: ""
    sandboxDisk: ""
    sandboxPublic: ""
    sandboxAutoStopInterval: ""
    sandboxAutoArchiveInterval: ""
    sandboxAutoDeleteInterval: ""
    signedPreviewExpiresSeconds: "86400"
    sandboxNamePrefix: ""
    sharedVolumeName: ""
    volumeNamePrefix: ""
    workspaceMountPath: ""
    dataMountPath: ""
    runtimeWorkspacePath: ""
    runtimeDataPath: ""
    sidecarDir: ""
    openworkPort: ""
    opencodePort: ""
    createTimeoutSeconds: ""
    deleteTimeoutSeconds: ""
    healthcheckTimeoutMs: ""
  polar:
    featureGateEnabled: "false"
    apiBase: ""
    productId: ""
    benefitId: ""
    successUrl: ""
    returnUrl: ""
  inference:
    openRouterWorkspaceId: ""
    stripeInferencePriceId: ""
    openRouterUpstreamUrl: ""
    creditsPerDollar: ""
  web:
    posthogKey: ""
    posthogHost: ""

observability:
  backend: none
  serviceNames:
    denApi: den-api
    denWeb: den-web
  otel:
    endpoint: ""
    tracesEndpoint: ""
    metricsEndpoint: ""
    logsEndpoint: ""
    protocol: http/protobuf
    exporters:
      traces: otlp
      metrics: otlp
      logs: otlp
    tracesSampler: parentbased_always_on
    tracesSamplerArg: ""
    headers:
      existingSecret: ""
      key: OTEL_EXPORTER_OTLP_HEADERS
  sentry:
    dsn: ""
    dsnSecret:
      existingSecret: ""
      key: SENTRY_DSN
    tracesSampleRate: "1"
    environment: ""
    release: ""
    dist: ""

customCa:
  enabled: false
  existingSecret: ""
  existingConfigMap: ""
  key: ca.crt

secret:
  create: false
  existingSecret: "openwork-ee"
  keys:
    databaseUrl: DATABASE_URL
    betterAuthSecret: BETTER_AUTH_SECRET
    denDbEncryptionKey: DEN_DB_ENCRYPTION_KEY
    daytonaApiKey: DAYTONA_API_KEY
    polarAccessToken: POLAR_ACCESS_TOKEN
    openRouterManagementApiKey: OPENROUTER_MANAGEMENT_API_KEY
    inferenceAdminToken: INFERENCE_ADMIN_TOKEN
    inferenceWebhookSecret: INFERENCE_WEBHOOK_SECRET
    emailFrom: EMAIL_FROM
    smtpHost: SMTP_HOST
    smtpPort: SMTP_PORT
    smtpUser: SMTP_USER
    smtpPass: SMTP_PASS
    smtpSecure: SMTP_SECURE
    githubConnectorAppClientSecret: GITHUB_CONNECTOR_APP_CLIENT_SECRET
    githubConnectorAppPrivateKey: GITHUB_CONNECTOR_APP_PRIVATE_KEY
    githubConnectorAppWebhookSecret: GITHUB_CONNECTOR_APP_WEBHOOK_SECRET
    connectLinkPrivateKey: DEN_CONNECT_LINK_PRIVATE_KEY

installerArtifacts:
  enabled: false
  existingClaim: ""
  hostPath: ""
  mountPath: /var/lib/openwork/installer-artifacts

denApi:
  replicaCount: 1
  image:
    repository: ghcr.io/different-ai/openwork-den-api
    tag: ""
  service:
    type: ClusterIP
    port: 8788
    annotations: {}
    loadBalancerClass: ""
    loadBalancerSourceRanges: []
  containerPort: 8788
  env: {}
  podAnnotations: {}
  podLabels: {}
  resources: {}
  probes:
    liveness:
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
    readiness:
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 5
      failureThreshold: 12

denWeb:
  replicaCount: 1
  image:
    repository: ghcr.io/different-ai/openwork-den-web
    tag: ""
  service:
    type: ClusterIP
    port: 3005
    annotations: {}
    loadBalancerClass: ""
    loadBalancerSourceRanges: []
  containerPort: 3005
  env: {}
  podAnnotations: {}
  podLabels: {}
  resources: {}
  probes:
    liveness:
      initialDelaySeconds: 60
      periodSeconds: 10
      timeoutSeconds: 10
      failureThreshold: 6
    readiness:
      initialDelaySeconds: 20
      periodSeconds: 5
      timeoutSeconds: 10
      failureThreshold: 18

inference:
  enabled: false
  replicaCount: 1
  image:
    repository: ghcr.io/different-ai/openwork-inference
    tag: ""
  service:
    type: ClusterIP
    port: 8791
    annotations: {}
    loadBalancerClass: ""
    loadBalancerSourceRanges: []
  containerPort: 8791
  env: {}
  podAnnotations: {}
  podLabels: {}
  resources: {}
  probes:
    liveness:
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
    readiness:
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 5
      failureThreshold: 12

migrations:
  enabled: true
  hook: true
  hookDeletePolicy: before-hook-creation,hook-succeeded
  backoffLimit: 2
  activeDeadlineSeconds: 600
  podAnnotations: {}
  resources: {}
  command:
    - node
  args:
    - /app/ee/packages/den-db/dist/scripts/bootstrap.js

ingress:
  enabled: false
  className: ""
  annotations: {}
  web:
    host: openwork.matiix310.dev
    path: /
    pathType: Prefix
  api:
    enabled: false
    host: openwork-api.matiix310.dev
    path: /
    pathType: Prefix
  tls: []
