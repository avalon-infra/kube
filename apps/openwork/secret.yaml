apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: openwork-ee
spec:
  path: kvv2/openwork
  type: Opaque
  templates:
    DATABASE_URL: "{% .Secrets.DATABASE_URL %}"
    BETTER_AUTH_SECRET: "{% .Secrets.BETTER_AUTH_SECRET %}"
    DEN_DB_ENCRYPTION_KEY: "{% .Secrets.DEN_DB_ENCRYPTION_KEY %}"
    DAYTONA_API_KEY: "{% .Secrets.DAYTONA_API_KEY %}"
    POLAR_ACCESS_TOKEN: "{% .Secrets.POLAR_ACCESS_TOKEN %}"
    OPENROUTER_MANAGEMENT_API_KEY: "{% .Secrets.OPENROUTER_MANAGEMENT_API_KEY %}"
    INFERENCE_ADMIN_TOKEN: "{% .Secrets.INFERENCE_ADMIN_TOKEN %}"
    INFERENCE_WEBHOOK_SECRET: "{% .Secrets.INFERENCE_WEBHOOK_SECRET %}"
    EMAIL_FROM: "{% .Secrets.EMAIL_FROM %}"
    SMTP_HOST: "{% .Secrets.SMTP_HOST %}"
    SMTP_PORT: "{% .Secrets.SMTP_PORT %}"
    SMTP_USER: "{% .Secrets.SMTP_USER %}"
    SMTP_PASS: "{% .Secrets.SMTP_PASS %}"
    SMTP_SECURE: "{% .Secrets.SMTP_SECURE %}"
    GITHUB_CONNECTOR_APP_CLIENT_SECRET: "{% .Secrets.GITHUB_CONNECTOR_APP_CLIENT_SECRET %}"
    GITHUB_CONNECTOR_APP_PRIVATE_KEY: "{% .Secrets.GITHUB_CONNECTOR_APP_PRIVATE_KEY %}"
    GITHUB_CONNECTOR_APP_WEBHOOK_SECRET: "{% .Secrets.GITHUB_CONNECTOR_APP_WEBHOOK_SECRET %}"
    DEN_CONNECT_LINK_PRIVATE_KEY: "{% .Secrets.DEN_CONNECT_LINK_PRIVATE_KEY %}"
