# Internal (private) CA for in-cluster TLS.
#
# ---------------------------------------------------------------------------
# WHY THIS EXISTS
# ---------------------------------------------------------------------------
# The public `prod-cluster-issuer` (ACME / Let's Encrypt) is the right issuer
# for anything a browser or a phone must be able to verify. It is the WRONG
# issuer for a private, in-cluster service such as the Vault API:
#
#   - A public CA is a shared trust anchor. Every CA in the public web PKI
#     can issue a certificate for a name, so a pod that trusts the public
#     roots trusts thousands of issuers for a service that has exactly one.
#   - It needs a public DNS name. `vault.vault.svc.cluster.local` is not a
#     public name - it can only ever be a SAN on a certificate that some CA
#     signs, and the public CA has no idea the name is not resolvable.
#   - It ties a private service's identity to the expiry and the renewal
#     of a public-domain certificate.
#
# This CA is the Kubernetes-native answer: a self-signed root, managed by
# cert-manager, that pods can be given explicitly. Nothing in the cluster
# trusts it by default - it is only trusted by the workloads that are
# pointed at it (see apps/vault/ and argo/vault-secrets-operator.yaml).
#
# ---------------------------------------------------------------------------
# THE THREE-STEP PATTERN (canonical cert-manager CA bootstrap)
# ---------------------------------------------------------------------------
#   1. selfSigned Issuer  - signs the CA Certificate below.
#   2. CA Certificate      - isCA: true, self-signed by that Issuer.
#      Its private key lives in the `vault-internal-ca` Secret, which
#      cert-manager creates. THE PRIVATE KEY IS NEVER IN GIT.
#   3. ca ClusterIssuer    - signs leaf certificates using the CA's key
#      from the Secret. Used by apps/vault/certificate-internal.yaml.
#
# It is a ClusterIssuer (not a namespaced Issuer) on purpose: a namespaced
# Issuer can only issue Certificates in its own namespace, and the point of
# an internal CA is that every app in the cluster can use it. The CA
# Secret is read from cert-manager's *cluster resource namespace*, which
# this installation sets to `cert-manager` (see the
# `--cluster-resource-namespace=$(POD_NAMESPACE)` argument on the
# cert-manager Deployment) - i.e. the namespace this file lives in.
#
# ---------------------------------------------------------------------------
# SYNC ORDERING
# ---------------------------------------------------------------------------
# ArgoCD applies every resource of the Application in one sync, and
# cert-manager resolves the dependency at the controller level: the `ca`
# ClusterIssuer reports NotReady until the CA Secret exists, and the leaf
# Certificate stays Pending until the Issuer is Ready. cert-manager then
# retries on its own, so the chain converges without an explicit sync-wave.
#
# The only ordering that DOES matter is the Vault side: the Vault pod must
# not be rolled with a `tls_cert_file` pointing at a Secret that does not
# exist yet. That is handled by rolling the Vault Application only after
# the CA is Ready (see argo/vault.yaml and apps/vault/README.md).
# ---------------------------------------------------------------------------

apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned-issuer
  namespace: cert-manager
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-internal-ca
  namespace: cert-manager
spec:
  # The key pair cert-manager generates here. It is the CA's private key
  # and it is written to the `vault-internal-ca` Secret - never to git.
  secretName: vault-internal-ca
  # A CA certificate. Without isCA: true, the `ca` Issuer below cannot
  # use it to sign anything.
  isCA: true
  commonName: avalon internal CA
  issuerRef:
    name: selfsigned-issuer
    kind: Issuer
  privateKey:
    algorithm: ECDSA
    size: 256
  # Long-lived on purpose: this is the trust anchor for the in-cluster
  # Vault identity. Rotating it means every consumer has to be updated
  # in lockstep, so it is renewed (same key, re-signed) rather than
  # replaced, and replaced only deliberately.
  duration: 87600h    # 10 years
  renewBefore: 8760h   # 1 year
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: internal-cluster-issuer
spec:
  ca:
    # Resolved in cert-manager's cluster resource namespace, which is
    # `cert-manager` on this cluster.
    secretName: vault-internal-ca
