apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: db-secret
spec:
  path: kvv2/homarr
  type: Opaque
  templates:
    # The TLS parameters are part of the URL because homarr hands this
    # string straight to the `pg` driver (node-postgres), and `pg` reads
    # them from the connection string.
    #
    #   sslmode=verify-full  encrypts the connection AND verifies the
    #                        server certificate: it must be signed by the CA
    #                        in sslrootcert, and the certificate must cover
    #                        the host that was dialled. This is NOT the same
    #                        as `require`, which encrypts without
    #                        authenticating the server, and not the libpq
    #                        default `prefer`, which is opportunistic.
    #   sslrootcert=<path>  the CA bundle, read FROM DISK. The path must
    #                        match where the `ca.crt` key of the
    #                        `internal-ca` Secret is mounted, which the
    #                        homarr chart does through
    #                        persistence.homarrTrustedCerts (see
    #                        apps/homarr/values.yaml).
    #
    # The `pg` driver reads `sslrootcert` with fs.readFileSync(), so this
    # has to be a file path, not the PEM content.
    db-url: "postgresql://{% .Secrets.DB_USER %}:{% .Secrets.DB_PASSWORD %}@pg-cluster-rw.postgres.svc.cluster.local:5432/homarr?sslmode=verify-full&sslrootcert=/appdata/trusted-certificates/ca.crt"
    db-encryption-key: "{% .Secrets.DB_ENCRYPTION_KEY %}"
