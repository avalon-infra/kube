persistence:
  homarrDatabase:
    enabled: false
  # The trust anchor for the PostgreSQL server certificate.
  #
  # Homarr talks to PostgreSQL with `sslmode=verify-full`, which makes the
  # `pg` driver verify the server certificate against a CA bundle on disk
  # AND check that the certificate covers the host it dialled.
  #
  # The chart has no generic "extra volumes" knob, but this persistence
  # option mounts the keys of an existing Secret as individual files, which
  # is exactly what a CA bundle needs. The Secret is the carrier
  # certificate from apps/homarr/certificate-internal-ca.yaml; only its
  # `ca.crt` key is mounted.
  homarrTrustedCerts:
    enabled: true
    type: existingSecret
    existingSecretName: internal-ca
    existingSecretKeys:
      - ca.crt
    mountPath: "/appdata/trusted-certificates"

database:
  type: postgresql

ingress:
  enabled: false

service:
  enabled: true

envSecrets:
  dbCredentials:
    dbUrlKey: db-url
    existingSecret: db-secret
  dbEncryption:
    key: db-encryption-key
    existingSecret: db-secret
  authOidcCredentials:
    existingSecret: homarr-oidc-credentials
    oidcClientId: client_id
    oidcClientSecret: client_secret

env:
  AUTH_OIDC_AUTO_LOGIN: true
  AUTH_OIDC_CLIENT_NAME: Avalon SSO
  AUTH_OIDC_ISSUER: https://auth.matiix310.dev
  AUTH_OIDC_URI: https://auth.matiix310.dev/authorize
  AUTH_LOGOUT_REDIRECT_URL: https://auth.matiix310.dev/api/oidc/end-session
  AUTH_PROVIDERS: oidc
