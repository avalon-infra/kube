apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: homarr-route
spec:
  entryPoints:
    - websecure
  tls:
    secretName: homarr-tls
  routes:
    - match: Host(`dashboard.matiix310.dev`)
      kind: Rule
      middlewares:
        - name: cloudflare-only
          namespace: kube-system
      services:
        - name: homarr
          port: 7575
