---
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: pocket-id-secrets
spec:
  path: kvv2/pocket-id
  keys:
    - encryption-key
  type: Opaque
---
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: pocket-id-db
spec:
  path: kvv2/pocket-id
  type: Opaque
  templates:
    db-url: "postgres://{% .Secrets.POSTGRES_USER %}:{% .Secrets.POSTGRES_PASSWORD %}@pg-cluster-rw.postgres.svc.cluster.local:5432/pocket-id"
