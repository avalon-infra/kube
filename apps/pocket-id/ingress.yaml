apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pocket-id-route
spec:
  entryPoints:
    - websecure
  tls:
    secretName: pocket-id-tls
  routes:
    - match: Host(`auth.matiix310.dev`)
      kind: Rule
      middlewares:
        - name: cloudflare-only
          namespace: kube-system
      services:
        - name: pocket-id
          port: http
    - match: Host(`pocket-id.matiix310.dev`)
      middlewares:
        - name: cloudflare-only
          namespace: kube-system
      services:
        - name: pocket-id
          port: http
