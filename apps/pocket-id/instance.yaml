apiVersion: pocketid.internal/v1alpha1
kind: PocketIDInstance
metadata:
  name: pocket-id
spec:
  encryptionKey:
    valueFrom:
      secretKeyRef:
        name: pocket-id-secrets
        key: encryption-key
  appUrl: "https://auth.matiix310.dev"
  databaseUrl:
    valueFrom:
      secretKeyRef:
        name: pocket-id-db
        key: db-url
  env:
    - name: TRUSTED_PLATFORM
      value: CF-Connecting-IP
  persistence:
    enabled: true
  metrics:
    enabled: false
  ui:
    appName: "Avalon SSO"
    sessionDuration: 1440
    accentColor: "#ffff00"
  userManagement:
    allowOwnAccountEdit: true
    allowUserSignups: "disabled"
  logging:
    level: "info"
    json: true
  versionCheckDisabled: true
  auditLogRetentionDays: 30
  timezone: "Europe/Paris"
  image: pocketid/pocket-id:v2.19.1
