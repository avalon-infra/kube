apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: homarr
spec:
  name: homarr
  description: Customizable dashboard
  isPublic: true
  callbackUrls:
    - https://dashboard.matiix310.dev/api/auth/callback/oidc
  launchUrl: https://dashboard.matiix310.dev
  logo:
    logoUrl: https://dashboard.matiix310.dev/logo/logo.png
    darkLogoUrl: https://dashboard.matiix310.dev/logo/logo.png
  secret:
    additionalAnnotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "homarr"
      reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "homarr"
