---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: homarr
spec:
  name: homarr
  description: Customizable dashboard
  isPublic: false
  callbackUrls:
    - https://dashboard.matiix310.dev/api/auth/callback/oidc
  launchUrl: https://dashboard.matiix310.dev
  logo:
    logoUrl: https://dashboard.matiix310.dev/logo/logo.png
    darkLogoUrl: https://dashboard.matiix310.dev/logo/logo.png
  secret:
    additionalAnnotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "homarr"
      reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "homarr"
---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: vault
spec:
  name: vault
  description: Secure secrets management
  isPublic: false
  callbackUrls:
    - https://vault.matiix310.dev/ui/vault/auth/avalon-sso/oidc/callback
  launchUrl: https://vault.matiix310.dev
  logo:
    logoUrl: https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/vault/vault-original.svg
    darkLogoUrl: https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/vault/vault-original.svg
---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: trilium
spec:
  name: trilium
  description: Customizable dashboard
  isPublic: false
  callbackUrls:
    - https://wiki.matiix310.dev/callback
  allowedUserGroups:
    - name: trilium-admins
  launchUrl: https://wiki.matiix310.dev
  logo:
    logoUrl: https://wiki.matiix310.dev/favicon.ico
    darkLogoUrl: https://wiki.matiix310.dev/favicon.ico
  secret:
    additionalAnnotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "trilium"
      reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "trilium"
