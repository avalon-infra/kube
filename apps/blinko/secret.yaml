apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: blinko-env
spec:
  path: kvv2/blinko
  type: Opaque
  templates:
    NEXTAUTH_SECRET: "{% .Secrets.NEXTAUTH_SECRET %}"
    # The TLS parameters are part of the URL because blinko hands this
    # string straight to Prisma, and Prisma reads them from the connection
    # string.
    #
    #   sslmode=verify-full  encrypts the connection AND verifies the
    #                        server certificate: it must be signed by the CA
    #                        in sslrootcert, and the certificate must cover
    #                        the host that was dialled. This is NOT the same
    #                        as `require`, which encrypts without
    #                        authenticating the server, and not the Prisma
    #                        default `prefer`, which is opportunistic.
    #   sslrootcert=<path>  the CA bundle, read FROM DISK. The path must
    #                        match where the `ca.crt` key of the
    #                        `internal-ca` Secret is mounted (see
    #                        apps/blinko/deployment.yaml).
    DATABASE_URL: "postgresql://{% .Secrets.POSTGRES_USER %}:{% .Secrets.POSTGRES_PASSWORD %}@pg-cluster-rw.postgres.svc.cluster.local:5432/blinko?sslmode=verify-full&sslrootcert=/etc/blinko/ca/ca.crt"
