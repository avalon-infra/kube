apiVersion: apps/v1
kind: Deployment
metadata:
  name: keeper-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keeper-api
  template:
    metadata:
      labels:
        app: keeper-api
    spec:
      containers:
        - name: keeper-api
          image: ghcr.io/ridafkih/keeper-api:2.23.0
          ports:
            - containerPort: 3001
              name: http
          env:
            - name: API_PORT
              value: "3001"
            - name: BETTER_AUTH_URL
              value: https://calendar.matiix310.dev
            - name: MCP_PUBLIC_URL
              value: https://calendar.matiix310.dev/mcp
            - name: MCP_API_URL
              value: http://keeper-api.keeper.svc.cluster.local:3001
            - name: BLOCK_PRIVATE_RESOLUTION
              value: "true"
            - name: PRIVATE_RESOLUTION_WHITELIST
              value: "radicale.radicale.svc.cluster.local:5232"
            - name: TRUSTED_ORIGINS
              value: https://calendar.matiix310.dev
            - name: NODE_ENV
              value: PRODUCTION
          envFrom:
            - secretRef:
                name: keeper-env
            - secretRef:
                name: keeper-pg
          # The trust anchor for the PostgreSQL server certificate. The
          # DATABASE_URL in `keeper-env` carries
          # `sslmode=verify-full&sslrootcert=/etc/keeper/ca/ca.crt`, so this
          # is the file that `pg` verifies the server certificate against.
          # Only the `ca.crt` key is mounted; the Secret also holds a
          # throwaway tls.crt/tls.key pair that carries nothing useful.
          volumeMounts:
            - name: postgres-ca
              mountPath: /etc/keeper/ca
              readOnly: true
      volumes:
        - name: postgres-ca
          secret:
            secretName: internal-ca
            items:
              - key: ca.crt
                path: ca.crt
