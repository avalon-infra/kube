apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: keeper-redis
spec:
  replicas: 1
  serviceName: keeper-redis
  selector:
    matchLabels:
      app: keeper-redis
  template:
    metadata:
      labels:
        app: keeper-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          stdin: true
          tty: true
          command:
            - /bin/sh
            - -c
            - |
              exec redis-server \
                --requirepass "$REDIS_PASSWORD" \
                --save 60 1
          ports:
            - containerPort: 6379
              name: redis
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keeper-env
                  key: REDIS_PASSWORD
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: keeper-redis-data