apiVersion: apps/v1
kind: Deployment
metadata:
  name: keeper-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keeper-mcp
  template:
    metadata:
      labels:
        app: keeper-mcp
    spec:
      containers:
        - name: keeper-mcp
          image: ghcr.io/ridafkih/keeper-mcp:2.23.0
          ports:
            - containerPort: 3002
              name: http
          env:
            - name: MCP_PORT
              value: "3002"
            - name: MCP_PUBLIC_URL
              value: https://calendar.matiix310.dev/mcp
            - name: MCP_API_URL
              value: http://keeper-api.keeper.svc.cluster.local:3001
            - name: BETTER_AUTH_URL
              value: https://calendar.matiix310.dev
            - name: NODE_ENV
              value: PRODUCTION
          envFrom:
            - secretRef:
                name: keeper-env
            - secretRef:
                name: keeper-pg
          # The trust anchor for the PostgreSQL server certificate. See
          # apps/keeper/api/deployment.yaml for the details.
          volumeMounts:
            - name: postgres-ca
              mountPath: /etc/keeper/ca
              readOnly: true
      volumes:
        - name: postgres-ca
          secret:
            secretName: internal-ca
            items:
              - key: ca.crt
                path: ca.crt
