apiVersion: apps/v1
kind: Deployment
metadata:
  name: keeper-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keeper-mcp
  template:
    metadata:
      labels:
        app: keeper-mcp
    spec:
      containers:
        - name: keeper-mcp
          image: ghcr.io/ridafkih/keeper-mcp:2.14.9
          stdin: true
          tty: true
          ports:
            - containerPort: 3002
              name: http
          env:
            - name: MCP_PORT
              value: "3002"
            - name: MCP_PUBLIC_URL
              value: https://calendar.matiix310.dev/mcp
            - name: MCP_API_URL
              value: http://keeper-api.keeper.svc.cluster.local:3001
            - name: BETTER_AUTH_URL
              value: https://calendar.matiix310.dev
          envFrom:
            - secretRef:
                name: keeper-env
            - secretRef:
                name: keeper-pg
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "768Mi"
              cpu: "1000m"