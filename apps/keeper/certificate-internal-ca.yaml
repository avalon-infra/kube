# keeper's PostgreSQL CA carrier — REMOVED, deliberately.
#
# ---------------------------------------------------------------------------
# WHY THIS FILE IS EMPTY
# ---------------------------------------------------------------------------
# This used to publish the cluster's internal CA (`internal-cluster-issuer`,
# see apps/cert-manager/internal-ca.yaml) into the keeper namespace, as a
# `ca.crt` key the keeper pods mounted at /etc/keeper/ca. It existed so
# that keeper's PostgreSQL connection could use `sslmode=verify-full`.
#
# It does not work, and the connection was reverted to plaintext.
#
# keeper runs on Bun and reaches PostgreSQL through drizzle-orm's `bun-sql`
# driver, i.e. `Bun.sql`. Measured behaviour of Bun 1.4.0:
#
#   Bun.sql ignores libpq's `sslrootcert`   -> forwards it to PostgreSQL as
#                                               a server parameter, and the
#                                               connection fails with
#                                               "unrecognized configuration
#                                               parameter"
#   Bun.sql ignores its `tls`/`ssl` ctor    -> drizzle's bun-sql wrapper
#                                               does not forward `tls` to
#                                               Bun.sql at all
#   NODE_EXTRA_CA_CERTS is NOT honoured     -> with NO CA configured,
#                                               `sslmode=verify-full` still
#                                               connects. The verification
#                                               is silently skipped. Only a
#                                               *wrong* CA errors, which is
#                                               not a guarantee.
#   Bun.sql `tls.ca` wants PEM CONTENT      -> not a file path, and
#                                               unreachable anyway because
#                                               of the wrapper above
#
# So `sslmode=verify-full` in keeper's DATABASE_URL was misleading: it
# implied the server was authenticated when it was not. It was removed, and
# with it the CA mount and this carrier.
#
# Making this genuinely verified would mean patching the keeper image with
# a custom `createDatabase()` that reads the CA and hands it to `Bun.sql`
# as PEM content. That is a fork of the upstream image and is out of scope
# for this cluster. The traffic stays on the single node.
#
# The other two consumers of the same PostgreSQL cluster - authentik
# (psycopg) and homarr (node-postgres) - DO verify the server certificate
# properly, and their carriers are still in place:
#
#   apps/authentik/certificate-internal-ca.yaml
#   apps/homarr/certificate-internal-ca.yaml
#
# If keeper is ever moved onto a driver that can verify (a patched
# `createDatabase()`), this carrier is exactly what it would need again.
