apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: keeper-env
spec:
  path: kvv2/keeper
  type: Opaque
  templates:
    BETTER_AUTH_SECRET: "{% .Secrets.BETTER_AUTH_SECRET %}"
    ENCRYPTION_KEY: "{% .Secrets.ENCRYPTION_KEY %}"
    REDIS_PASSWORD: "{% .Secrets.REDIS_PASSWORD %}"
    # PostgreSQL is reached over PLAINTEXT, deliberately.
    #
    # The server (CNPG) does have TLS enabled and presents a certificate
    # issued by the cluster's internal CA, but keeper's driver cannot
    # actually verify it:
    #
    #   - keeper runs on Bun and uses drizzle-orm's `bun-sql` driver, i.e.
    #     `Bun.sql`. Bun does not implement libpq's `sslrootcert`
    #     parameter (it forwards it to PostgreSQL as a server-side
    #     parameter, and the connection fails with "unrecognized
    #     configuration parameter"), and it ignores the `tls`/`ssl`
    #     options of its constructor.
    #   - `NODE_EXTRA_CA_CERTS` is NOT honoured by Bun's postgres driver.
    #     With it set, `sslmode=verify-full` still connects when NO CA is
    #     configured at all - the verification is silently skipped. Only a
    #     *wrong* CA produces an error, which is not a guarantee.
    #   - Bun's `tls.ca` option only accepts the CA as PEM CONTENT, not as
    #     a file path, and drizzle's `bun-sql` wrapper does not forward
    #     `tls` to `Bun.sql` at all.
    #
    # So `sslmode=verify-full` here would be misleading: it suggests the
    # server is authenticated when it is not. It was removed rather than
    # left in place to look like protection that does not exist.
    #
    # Making this genuinely verified would require patching the keeper
    # image (a custom `createDatabase()` that reads the CA and passes it
    # to `Bun.sql` as PEM), which is out of scope for this cluster. The
    # traffic stays inside the node.
    #
    # The other two consumers of the same PostgreSQL cluster - authentik
    # (psycopg) and homarr (node-postgres) - DO verify the server
    # certificate properly. See apps/authentik/ and apps/homarr/.
    DATABASE_URL: "postgres://{% .Secrets.POSTGRES_USER %}:{% .Secrets.POSTGRES_PASSWORD %}@pg-cluster-rw.postgres.svc.cluster.local:5432/keeper"
    REDIS_URL: "redis://:{% .Secrets.REDIS_PASSWORD %}@keeper-redis.keeper.svc.cluster.local:6379"
    GOOGLE_CLIENT_ID: "{% .Secrets.GOOGLE_CLIENT_ID %}"
    GOOGLE_CLIENT_SECRET: "{% .Secrets.GOOGLE_CLIENT_SECRET %}"
    MICROSOFT_CLIENT_ID: "{% .Secrets.MICROSOFT_CLIENT_ID %}"
    MICROSOFT_CLIENT_SECRET: "{% .Secrets.MICROSOFT_CLIENT_SECRET %}"
