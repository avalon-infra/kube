apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: keeper-env
spec:
  path: kvv2/keeper
  type: Opaque
  templates:
    BETTER_AUTH_SECRET: "{% .Secrets.BETTER_AUTH_SECRET %}"
    ENCRYPTION_KEY: "{% .Secrets.ENCRYPTION_KEY %}"
    REDIS_PASSWORD: "{% .Secrets.REDIS_PASSWORD %}"
    # The TLS parameters are part of the URL because keeper hands this
    # string straight to the `pg` driver, and `pg` reads them from the
    # connection string.
    #
    #   sslmode=verify-full  encrypts the connection AND verifies the
    #                        server certificate: it must be signed by the CA
    #                        in sslrootcert, and the certificate must cover
    #                        the host that was dialled. This is NOT the same
    #                        as `require`, which encrypts without
    #                        authenticating the server, and not the libpq
    #                        default `prefer`, which is opportunistic.
    #   sslrootcert=<path>  the CA bundle, read FROM DISK. The path must
    #                        match where the `ca.crt` key of the
    #                        `internal-ca` Secret is mounted in every
    #                        keeper pod that talks to the database
    #                        (see apps/keeper/*/deployment.yaml).
    #
    # The `pg` driver reads `sslrootcert` with fs.readFileSync(), so this
    # has to be a file path, not the PEM content.
    DATABASE_URL: "postgres://{% .Secrets.POSTGRES_USER %}:{% .Secrets.POSTGRES_PASSWORD %}@pg-cluster-rw.postgres.svc.cluster.local:5432/keeper?sslmode=verify-full&sslrootcert=/etc/keeper/ca/ca.crt"
    REDIS_URL: "redis://:{% .Secrets.REDIS_PASSWORD %}@keeper-redis.keeper.svc.cluster.local:6379"
    GOOGLE_CLIENT_ID: "{% .Secrets.GOOGLE_CLIENT_ID %}"
    GOOGLE_CLIENT_SECRET: "{% .Secrets.GOOGLE_CLIENT_SECRET %}"
    MICROSOFT_CLIENT_ID: "{% .Secrets.MICROSOFT_CLIENT_ID %}"
    MICROSOFT_CLIENT_SECRET: "{% .Secrets.MICROSOFT_CLIENT_SECRET %}"
