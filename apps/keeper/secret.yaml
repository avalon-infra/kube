apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: keeper-env
spec:
  path: kvv2/keeper
  type: Opaque
  templates:
    BETTER_AUTH_SECRET: "{% .Secrets.BETTER_AUTH_SECRET %}"
    ENCRYPTION_KEY: "{% .Secrets.ENCRYPTION_KEY %}"
    REDIS_PASSWORD: "{% .Secrets.REDIS_PASSWORD %}"
    # The TLS parameters are part of the URL.
    #
    # keeper talks to PostgreSQL through `Bun.sql` (the keeper services run
    # on Bun and use drizzle-orm's bun-sql driver), and Bun.sql reads
    # `sslmode` from the connection URL:
    #
    #   sslmode=verify-full  encrypts the connection AND verifies the
    #                        server certificate: it must be signed by a CA
    #                        the client trusts, and the certificate must
    #                        cover the host that was dialled. This is NOT
    #                        the same as `require`, which encrypts without
    #                        authenticating the server, and not the libpq
    #                        default `prefer`, which is opportunistic.
    #
    # The CA itself is NOT given here. Bun.sql does not implement
    # libpq's `sslrootcert` parameter - passing it makes Bun forward it to
    # PostgreSQL as a server-side parameter and the connection fails with
    # "unrecognized configuration parameter". Bun.sql also ignores the
    # `tls` and `ssl` options of its constructor, so the only way to give
    # it a CA is the NODE_EXTRA_CA_CERTS environment variable, which is
    # set on every keeper pod that talks to the database (see
    # apps/keeper/*/deployment.yaml).
    #
    # Verified behaviour of that combination:
    #   correct CA   -> connects, pg_stat_ssl shows ssl = true
    #   unrelated CA -> UNABLE_TO_VERIFY_LEAF_SIGNATURE
    #   no CA        -> UNABLE_TO_VERIFY_LEAF_SIGNATURE
    DATABASE_URL: "postgres://{% .Secrets.POSTGRES_USER %}:{% .Secrets.POSTGRES_PASSWORD %}@pg-cluster-rw.postgres.svc.cluster.local:5432/keeper?sslmode=verify-full"
    REDIS_URL: "redis://:{% .Secrets.REDIS_PASSWORD %}@keeper-redis.keeper.svc.cluster.local:6379"
    GOOGLE_CLIENT_ID: "{% .Secrets.GOOGLE_CLIENT_ID %}"
    GOOGLE_CLIENT_SECRET: "{% .Secrets.GOOGLE_CLIENT_SECRET %}"
    MICROSOFT_CLIENT_ID: "{% .Secrets.MICROSOFT_CLIENT_ID %}"
    MICROSOFT_CLIENT_SECRET: "{% .Secrets.MICROSOFT_CLIENT_SECRET %}"
