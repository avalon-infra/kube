apiVersion: apps/v1
kind: Deployment
metadata:
  name: keeper-cron
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keeper-cron
  template:
    metadata:
      labels:
        app: keeper-cron
    spec:
      containers:
        - name: keeper-cron
          image: ghcr.io/ridafkih/keeper-cron:2.23.0
          env:
            # The trust anchor for the PostgreSQL server certificate.
            #
            # Bun.sql (the driver keeper uses) cannot take the CA from the
            # connection URL - it does not implement libpq's `sslrootcert`
            # parameter and ignores the `tls`/`ssl` constructor options.
            # NODE_EXTRA_CA_CERTS is the supported way to give it one, and
            # it points at a FILE, so the CA has to be mounted into the pod.
            #
            # Only the `ca.crt` key is mounted; the Secret also holds a
            # throwaway tls.crt/tls.key pair that carries nothing useful.
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/keeper/ca/ca.crt
            - name: WORKER_JOB_QUEUE_ENABLED
              value: "true"
            - name: BLOCK_PRIVATE_RESOLUTION
              value: "true"
            - name: NODE_ENV
              value: PRODUCTION
          envFrom:
            - secretRef:
                name: keeper-env
            - secretRef:
                name: keeper-pg
          # The trust anchor for the PostgreSQL server certificate. See
          # apps/keeper/api/deployment.yaml for the details.
          volumeMounts:
            - name: postgres-ca
              mountPath: /etc/keeper/ca
              readOnly: true
      volumes:
        - name: postgres-ca
          secret:
            secretName: internal-ca
            items:
              - key: ca.crt
                path: ca.crt
