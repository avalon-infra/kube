apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: portfolio-route
spec:
  entryPoints:
    - websecure
  tls:
    secretName: tls-certificate
  routes:
    - match: Host(`matiix310.dev`)
      kind: Rule
      middlewares:
        - name: cloudflare-only
          namespace: kube-system
      services:
        - name: portfolio
          port: 80
