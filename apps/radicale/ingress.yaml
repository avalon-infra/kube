apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: radicale-route
spec:
  entryPoints:
    - websecure
  tls:
    secretName: radicale-tls
  routes:
    - match: Host(`radicale.matiix310.dev`)
      kind: Rule
      middlewares:
        - name: cloudflare-only
          namespace: kube-system
      services:
        - name: radicale
          port: 5232