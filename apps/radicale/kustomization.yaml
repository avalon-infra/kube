apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - certificate.yaml
  - deployment.yaml
  - ingress.yaml
  - pvc.yaml
  - secret.yaml
  - service.yaml

configMapGenerator:
  - name: radicale-config
    files:
      - config=radicale.ini
    options:
      disableNameSuffixHash: true