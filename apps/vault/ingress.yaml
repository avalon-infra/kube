# Vault's Traefik route - the ONLY route to Vault, reached over WireGuard.
#
# ---------------------------------------------------------------------------
# ONE NAME, ONE ROUTE
# ---------------------------------------------------------------------------
# Vault used to be published on the internet at https://vault.matiix310.dev,
# and a second, VPN-only route used https://vault.vpn.matiix310.dev. Two
# names, two certificates, and a migration between them.
#
# There is now exactly ONE route and ONE name: `vault.matiix310.dev`.
#
# It lives in THIS namespace (vault) because that is where the `vault`
# Service is. An IngressRoute in another namespace cannot reference it
# without an explicit `namespace:` field - and the previous
# `apps/wireguard/vault-vpn-route.yaml` did not have one, so Traefik
# logged:
#
#   error="kubernetes service not found: wireguard/vault"
#
# continuously. That route never worked. This one is in the right
# namespace, so it resolves.
#
# ---------------------------------------------------------------------------
# WHY THERE IS NO IP ALLOWLIST
# ---------------------------------------------------------------------------
# The obvious approach - allowlist the tunnel subnet 10.8.0.0/24 - does
# not work, and it is worth understanding why:
#
#   chain KUBE-SVC-UEJ6RQQLJG4VJPPB {
#       ip saddr != 10.42.0.0/16 ip daddr 10.43.9.131 ... jump KUBE-MARK-MASQ
#   }
#
# A VPN peer at 10.8.0.x is NOT in the pod CIDR, so kube-proxy MASQUERADES
# its traffic to the node IP (51.68.191.40) before the connection reaches
# the pod. By the time Traefik sees the connection, the source IP is the
# node IP, not 10.8.0.x.
#
# Traefik has neither `forwardedHeaders` nor `proxyProtocol` configured
# (verified with `kubectl -n kube-system get deploy traefik`), so it has
# no other way to recover the real peer address. An IPAllowList would
# therefore have to allow 10.42.0.0/16 / 10.43.0.0/16 - which means any
# pod in the cluster could reach the route. That is not a security
# control.
#
# The control is instead: **the route does not exist publicly.** The
# public IngressRoute that used to publish vault.matiix310.dev to the
# internet has been removed, so this is the only route to Vault and it
# is reached through the WireGuard tunnel. That is stronger than "the
# route exists but rejects some IPs".
#
# The hostname resolves to the Vault ClusterIP (10.43.9.131) for VPN
# clients, so the request genuinely travels over wg0. See
# apps/wireguard/README.md, section "Opening the tunnel to the cluster",
# for the DNS and AllowedIPs setup.
# ---------------------------------------------------------------------------

apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: traefik-vault-transport
spec:
  # Vault's pod serves the `vault-tls` certificate, whose only SAN is
  # vault.matiix310.dev. The hostname is a routing label; the TLS
  # handshake still happens against the Vault pod - so serverName is
  # pinned rather than disabling verification.
  serverName: vault.matiix310.dev
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: vault-route
spec:
  entryPoints:
    - websecure
  tls:
    secretName: vault-tls
  routes:
    - match: Host(`vault.matiix310.dev`)
      kind: Rule
      middlewares:
        - name: vault-vpn-only
          namespace: vault
      services:
        - name: vault
          port: 8200
          scheme: https
          serversTransport: traefik-vault-transport
---
# Restrict this route to traffic that arrived over the WireGuard tunnel.
#
# ---------------------------------------------------------------------------
# WHY THIS WORKS
# ---------------------------------------------------------------------------
# A peer at 10.8.0.x is OUTSIDE the pod CIDR, so kube-proxy's Service
# rule matches it:
#
#   chain KUBE-SVC-UEJ6RQQLJG4VJPPB {
#       ip saddr != 10.42.0.0/16 ip daddr 10.43.9.131 tcp dport 8200
#           jump KUBE-MARK-MASQ
#   }
#
# But that rule only MARKS the packet. It does not SNAT it. The
# postrouting chain decides:
#
#   chain KUBE-POSTROUTING {
#       meta mark & 0x00004000 != 0x00004000  return       <- 2303 packets: RETURN
#       ...                                     MASQUERADE  <- only 2 packets SNAT'd
#   }
#
# The masquerade that would rewrite the source only applies to traffic
# ORIGINATING in the pod network (flannel's
# `ip saddr 10.42.0.0/16 ... MASQUERADE`). Traffic from 10.8.0.x is not
# in that range, so it keeps its real source address all the way to the
# Vault pod.
#
# Verified on this cluster:
#
#   # pod's route back to a peer (the reply path)
#   10.8.0.2 via 10.42.0.1 dev eth0        -> host -> wg0  ✓
#   # host forwarding
#   -A FORWARD -o wg0 -j ACCEPT            ✓
#
# So Traefik sees the genuine peer address (10.8.0.x) and can allowlist
# it. A request from the public internet arrives with the node's public
# address instead, and is rejected.
#
# NOTE: this relies on kube-proxy NOT masquerading non-pod-CIDR traffic
# to ClusterIPs. That is the current behaviour of this cluster's
# kube-proxy (k3s, iptables mode). If the CNI or kube-proxy is ever
# changed to a mode that SNATs external traffic to ClusterIPs, this
# middleware would silently start rejecting legitimate VPN clients
# (403). Re-verify with:
#
#   nft list table ip nat | grep -A4 KUBE-POSTROUTING
#
# The reply path also needs the host to route pod traffic back out wg0,
# which is satisfied by `-A FORWARD -o wg0 -j ACCEPT`.
# ---------------------------------------------------------------------------
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: vault-vpn-only
spec:
  ipAllowList:
    sourceRange:
      # The WireGuard client subnet. wg-easy assigns 10.8.0.2, .3, ...
      #
      # This is the ONLY range allowed. The pod CIDR (10.42.0.0/16) is
      # deliberately NOT here: kube-proxy/flannel masquerade traffic that
      # arrives on the node's public IP into the cni0 address
      # (10.42.0.1), so a public request looks like it came from the pod
      # network and would be allowed. Verified:
      #
      #   chain FLANNEL-POSTRTG {
      #       ip saddr != 10.42.0.0/16 ip daddr 10.42.0.0/16 ... MASQUERADE
      #   }
      #
      # With the pod CIDR allowed, a request straight to the node IP
      # (51.68.191.40:443) still succeeded with HTTP 200. Only the
      # tunnel range gives an unambiguous answer.
      - "10.8.0.0/24"
