apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - certificate.yaml
  # The in-cluster TLS identity: leaf certificate issued by the internal
  # CA (apps/cert-manager/internal-ca.yaml), plus the Service that
  # carries Vault's internal listener (8300).
  - certificate-internal.yaml
  - service.yaml
  # The only route to Vault. It is NOT published to the internet - the
  # hostname resolves to the ClusterIP for VPN clients only, so the route
  # is reachable through the WireGuard tunnel and nowhere else.
  - ingress.yaml
