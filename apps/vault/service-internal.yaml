# Service for Vault's in-cluster (internal CA) listener.
#
# ---------------------------------------------------------------------------
# WHY A SEPARATE SERVICE
# ---------------------------------------------------------------------------
# The Helm chart's `vault` Service template hard-codes exactly two ports:
# 8200 (the API) and 8201 (the raft cluster port). There is no chart value
# to add a third one, so the internal listener on 8300 cannot be added to
# that Service without forking the chart.
#
# This Service is therefore defined here, next to the Certificate that
# backs the listener, and is applied by the same ArgoCD Application
# (`argo/vault.yaml`) that renders the chart - so it is still pure
# GitOps and it is still pruned when it is deleted from the repo.
#
# The chart's Service keeps 8200 and 8201 exactly as they are. This one
# is additive: it does not replace anything, and removing it only removes
# the in-cluster API.
#
# ---------------------------------------------------------------------------
# SELECTOR
# ---------------------------------------------------------------------------
# The same selector the chart uses for the `vault` Service:
#
#   app.kubernetes.io/name=vault
#   app.kubernetes.io/instance=vault
#   component=server
#
# That selects the Vault server pod(s) whatever their HA role, which is
# what we want: the operator is a single client and does not care whether
# it lands on the active node or on a standby - Vault forwards the
# request to the active node itself.
#
# ---------------------------------------------------------------------------
# PORT
# ---------------------------------------------------------------------------
# 8300 -> 8300, matching the container port declared in
# `server.extraPorts` (argo/vault.yaml) and the `tcp-internal` listener
# in the raft config. The Traefik rule from AGENTS.md applies here too:
# the Service port must equal the container port.
# ---------------------------------------------------------------------------

apiVersion: v1
kind: Service
metadata:
  name: vault-internal-api
  namespace: vault
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/instance: vault
    component: server
    app.kubernetes.io/managed-by: ArgoCD
  annotations:
    argocd.argoproj.io/tracking-id: vault:apps/Service:vault/vault-internal-api
spec:
  type: ClusterIP
  ports:
    # The port NAME has to be at most 15 characters (Kubernetes
    # IANA_SVC_NAME rule), so it cannot be "https-internal-api". It
    # matches the containerPort name in argo/vault.yaml.
    - name: vault-internal
      port: 8300
      targetPort: 8300
      protocol: TCP
  selector:
    app.kubernetes.io/name: vault
    app.kubernetes.io/instance: vault
    component: server
