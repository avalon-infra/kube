apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trilium
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - chart: trilium
      repoURL: https://triliumnext.github.io/helm-charts
      targetRevision: 2.0.0
      helm:
        valueFiles:
          - "$values/apps/trilium/values.yaml"
    - repoURL: https://github.com/avalon-infra/kube.git
      targetRevision: HEAD
      path: apps/trilium
      ref: values
  destination:
    name: in-cluster
    namespace: trilium
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true
