apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault-secrets-operator-system
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - chart: vault-secrets-operator
      repoURL: oci://ghcr.io/ricoberger/charts/vault-secrets-operator
      targetRevision: 3.1.5
      helm:
        values: |
          vault:
            # Talk to Vault DIRECTLY over the cluster network, on the
            # in-cluster listener, using the Service DNS name.
            #
            # This keeps the operator off the public route entirely, so
            # Vault can be unpublished (no vault.matiix310.dev
            # IngressRoute) without breaking secret materialisation.
            #
            # Port 8300 is Vault's INTERNAL listener (argo/vault.yaml).
            # It serves the certificate issued by the private CA in
            # apps/cert-manager/internal-ca.yaml, and only the pods that
            # are explicitly given that CA can verify it.
            address: "https://vault.vault.svc.cluster.local:8300"
            authMethod: kubernetes

          # The private CA that signed Vault's internal certificate, mounted
          # into the operator so it can verify the server certificate.
          #
          # VAULT_CACERT points at a FILE PATH, not at PEM content. The
          # file is the `ca.crt` key of the `vault-internal-ca` Secret in
          # this namespace (apps/vault-secrets-operator/certificate-ca.yaml).
          #
          # A pod can only mount Secrets from its own namespace, which is
          # why that Secret exists here rather than being read straight
          # from the `cert-manager` namespace. See the file header there.
          #
          # NOTE: VAULT_CACERT REPLACES the trust store, it does not add
          # to it. The Vault API client loads the CA file into a fresh
          # x509.CertPool and uses that pool on its own, so the public
          # root CAs are NOT trusted any more. That is the point: the
          # operator only needs to talk to one private service, and it
          # should not be able to be fooled by any public CA.
          environmentVars:
            - name: VAULT_CACERT
              value: "/etc/vault-secrets-operator/ca.pem"

          volumes:
            - name: vault-internal-ca
              secret:
                secretName: vault-internal-ca
                items:
                  # Only the CA certificate. The Secret also holds a
                  # throwaway tls.crt/tls.key pair, which the operator
                  # does not need and does not mount.
                  - key: ca.crt
                    path: ca.pem

          image:
            volumeMounts:
              - name: vault-internal-ca
                mountPath: /etc/vault-secrets-operator
                readOnly: true

    - repoURL: https://github.com/avalon-infra/kube.git
      path: apps/vault-secrets-operator
      targetRevision: HEAD
  destination:
    name: in-cluster
    namespace: vault-secrets-operator-system
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true
