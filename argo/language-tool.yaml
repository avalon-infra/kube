apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: language-tool
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - chart: language-tool
      repoURL: https://zekker6.github.io/helm-charts
      targetRevision: 1.12.1
      helm:
        valueFiles:
          - "$values/apps/language-tool/values.yaml"
    - repoURL: https://github.com/avalon-infra/kube.git
      targetRevision: HEAD
      path: apps/language-tool
      ref: values
  destination:
    name: in-cluster
    namespace: language-tool
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true