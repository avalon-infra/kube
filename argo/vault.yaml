apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - chart: vault
      repoURL: https://helm.releases.hashicorp.com
      targetRevision: 0.32.0
      helm:
        values: |
          global:
            enabled: true
            tlsDisable: false
            resources:
              requests:
                memory: 256Mi
                cpu: 250m
              limits:
                memory: 256Mi
                cpu: 250m

          injector:
            enabled: false

          server:
            # These Resource Limits are in line with node requirements in the
            # Vault Reference Architecture for a Small Cluster
            resources:
              requests:
                memory: 2Gi
                cpu: 500m
              limits:
                memory: 4Gi
                cpu: 500m

            # Probes are disabled in the Helm chart and replaced via a kustomize patch
            # in apps/vault/. The chart's exec probe (vault status) and HTTP probe
            # (path) fail when sealed because vault status exits non-zero and the
            # cert SAN doesn't match localhost. We use TCP socket probes instead.
            readinessProbe:
              enabled: false
            livenessProbe:
              enabled: false

            # extraEnvironmentVars is a list of extra environment variables to set with the stateful set. These could be
            # used to include variables required for auto-unseal.
            extraEnvironmentVars:
              VAULT_TLSCERT: /vault/userconfig/vault-tls/tls.crt
              VAULT_TLSKEY: /vault/userconfig/vault-tls/tls.key

            # This configures the Vault Statefulset to create a PVC for audit logs.
            # See https://www.vaultproject.io/docs/audit/index.html to know more
            auditStorage:
              enabled: false

            volumes:
              - name: userconfig-vault-tls
                secret:
                  secretName: vault-tls

            volumeMounts:
              - mountPath: /vault/userconfig/vault-tls
                name: userconfig-vault-tls
                readOnly: true

            standalone:
              enabled: false

            ha:
              enabled: true
              replicas: 1
              raft:
                enabled: true
                setNodeId: true
                config: |
                  ui = true
                  cluster_name = "vault-integrated-storage"
                  listener "tcp" {
                    tls_disable = 0
                    address = "[::]:8200"
                    cluster_address = "[::]:8201"
                    tls_cert_file = "/vault/userconfig/vault-tls/tls.crt"
                    tls_key_file  = "/vault/userconfig/vault-tls/tls.key"
                  }

                  storage "raft" {
                    path = "/vault/data"
                  }

                  disable_mlock = true
                  service_registration "kubernetes" {}

    - repoURL: https://github.com/avalon-infra/kube.git
      path: apps/vault
      targetRevision: HEAD
      ref: vault
  destination:
    name: in-cluster
    namespace: vault
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true
