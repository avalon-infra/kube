apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - chart: vault
      repoURL: https://helm.releases.hashicorp.com
      targetRevision: 0.32.0
      helm:
        values: |
          global:
            enabled: true
            tlsDisable: false
            resources:
              requests:
                memory: 256Mi
                cpu: 250m
              limits:
                memory: 256Mi
                cpu: 250m

          injector:
            enabled: false

          server:
            # These Resource Limits are in line with node requirements in the
            # Vault Reference Architecture for a Small Cluster
            resources:
              requests:
                memory: 2Gi
                cpu: 500m
              limits:
                memory: 4Gi
                cpu: 500m

            # For HA configuration and because we need to manually init the vault,
            # we need to define custom readiness/liveness Probe settings
            #
            # The liveness probe MUST be sealed-tolerant. Vault answers
            # /v1/sys/health with 503 while it is sealed (or uninitialised),
            # which is a normal OPERATIONAL state, not a dead process.
            #
            # With the old path ("/v1/sys/health?standbyok=true") the kubelet
            # killed vault-0 roughly every 70s (initialDelaySeconds: 60 +
            # 2 x periodSeconds: 5), so the container was restarted before it
            # could ever be unsealed. Every restart re-sealed it, so the
            # crash loop was self-sustaining (7375 restarts over 19 days).
            # It also made manual unsealing impossible: the container died
            # before "vault operator unseal" could complete.
            #
            # "sealedcode=204&uninitcode=204" tells Vault to answer 204 for
            # those states, so the liveness probe only fails when the HTTP
            # listener is genuinely gone - which is what liveness means.
            # The timings are relaxed as well (periodSeconds 15,
            # timeoutSeconds 5, failureThreshold 6 -> ~2.5 min of tolerance)
            # so a slow raft recovery does not trip the probe either.
            #
            # NOTE: the chart (0.32.0) does not render a startupProbe for the
            # server StatefulSet, only readinessProbe and livenessProbe.
            readinessProbe:
              enabled: true
              path: "/v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204"
            livenessProbe:
              enabled: true
              path: "/v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204"
              initialDelaySeconds: 60
              periodSeconds: 15
              timeoutSeconds: 5
              failureThreshold: 6

            # extraEnvironmentVars is a list of extra environment variables to set with the stateful set. These could be
            # used to include variables required for auto-unseal.
            extraEnvironmentVars:
              VAULT_TLSCERT: /vault/userconfig/vault-tls/tls.crt
              VAULT_TLSKEY: /vault/userconfig/vault-tls/tls.key

            # This configures the Vault Statefulset to create a PVC for audit logs.
            # See https://www.vaultproject.io/docs/audit/index.html to know more
            auditStorage:
              enabled: false

            volumes:
              - name: userconfig-vault-tls
                secret:
                  secretName: vault-tls

            volumeMounts:
              - mountPath: /vault/userconfig/vault-tls
                name: userconfig-vault-tls
                readOnly: true

            standalone:
              enabled: false

            ha:
              enabled: true
              replicas: 1
              raft:
                enabled: true
                setNodeId: true
                config: |
                  ui = true
                  cluster_name = "vault-integrated-storage"
                  listener "tcp" {
                    tls_disable = 0
                    address = "[::]:8200"
                    cluster_address = "[::]:8201"
                    tls_cert_file = "/vault/userconfig/vault-tls/tls.crt"
                    tls_key_file  = "/vault/userconfig/vault-tls/tls.key"
                  }

                  storage "raft" {
                    path = "/vault/data"
                  }

                  disable_mlock = true
                  service_registration "kubernetes" {}

    - repoURL: https://github.com/avalon-infra/kube.git
      path: apps/vault
      targetRevision: HEAD
  destination:
    name: in-cluster
    namespace: vault
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true
